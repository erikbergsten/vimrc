# SOPS creation rule: encrypt with PGP (GPG) keys. Replace the placeholder
# fingerprint below with your key's fingerprint
# (gpg --list-secret-keys --keyid-format long); add one per
# laptop/workstation, comma separated. No path_regex: this single rule
# matches every file. sops finds this file starting in the current directory
# and walking up, so run sops from the repo root (or pass --config).
creation_rules:
  - pgp: '0000000000000000000000000000000000000000'
