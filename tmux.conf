bind v split-window -v
bind t split-window -h
unbind '"'
unbind %

# necessary width for a 80 cols vim with line nmubers and 81st col highlighter
# using numberwidth=5 in files with < 100000 lines!
set-window-option -g main-pane-width 86

bind r source-file ~/.config/tmux/tmux.conf

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind H resize-pane -L 10
bind L resize-pane -R 10
bind J resize-pane -D 10
bind K resize-pane -U 10

bind C-h resize-pane -L 1
bind C-l resize-pane -R 1
bind C-j resize-pane -D 1
bind C-k resize-pane -U 1

bind s copy-mode
bind a set-window-option synchronize-panes
bind A select-layout main-vertical
# necessary extra width for 2 columns in vim both with 80 col width
bind c-a select-layout main-vertical \; resize-pane -R 87

set-window-option -g mode-keys vi
set-option -s set-clipboard off
bind P send-keys `wl-paste`
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi c-v send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'cat > ~/.clip'
bind-key P load-buffer ~/.clip \; paste-buffer


bind-key w  send-keys C-a watch Space Enter
bind-key W  send-keys C-a watch10 Space Enter

bind-key C-b send-keys C-b

bind-key x break-pane
bind-key 0 swap-pane -t 0 -d
bind-key C-x join-pane -t :0

bind-key R command-prompt -p "Rename pane to:" "set-option -p @name '%%'"
set-option -g pane-border-status top
set -g pane-border-format "#{?pane_active,\\,/} #{?@name,#{@name},x} #{?pane_active,\\,/}"

set-option -g status-position top
set-option -g status-style fg=colour2,bg=default
set-option -g status-right ""
set-option -g status-left ""
set-window-option -g window-status-format "  #[fg=colour241]\\ #{?#W,#W,x}#{?@notification,(!),} \\  "
set-window-option -g window-status-current-format "  #[fg=colour2]\\ #{?#W,#W,x} \\  "
bind-key Tab send-keys C-b n
bind-key BTab send-keys C-b p
bind-key C-c send-keys C-b c
bind-key C-r send-keys C-b R Enter
bind -n M-H send-keys C-b p
bind -n M-L send-keys C-b n
bind -n M-N send-keys C-b c
bind-key C-t send-keys 'tmux set-option -p @name tabs && TMUX="" tmux && clear' Enter

# Hide the status bar by default if starting with one window
set -g status off

# Create a custom command to check window count and toggle the status bar
set-hook -g window-linked 'if-shell "[ #{session_windows} -gt 1 ]" "set status on" "set status off"'
set-hook -g window-unlinked 'if-shell "[ #{session_windows} -gt 1 ]" "set status on" "set status off"'

set-option -g automatic-rename-format '#{?@name,#{@name},}'
set-option -g status-interval 1


# Trigger a command whenever a window is switched
set-hook -g after-select-window 'set-option -p @notification ""'
set -g pane-border-style fg=green
